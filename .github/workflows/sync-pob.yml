name: Sync PathOfBuilding Vendor

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream PathOfBuildingCommunity ref to merge"
        required: false
        default: "dev"
      dry_run:
        description: "Fetch and merge-check without pushing changes"
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-pathofbuilding-vendor
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PATH_CHAIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Add upstream PoB remote
        run: git remote add pob-upstream https://github.com/PathOfBuildingCommunity/PathOfBuilding.git

      - name: Fetch upstream PoB
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'dev' }}
        run: git fetch pob-upstream "${UPSTREAM_REF}"

      - name: Merge upstream into vendor subtree
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'dev' }}
        run: |
          git subtree pull \
            --prefix=vendor/PathOfBuilding \
            pob-upstream "${UPSTREAM_REF}" \
            -m "chore: sync PathOfBuilding ${UPSTREAM_REF}"

      - name: Verify Elegant Hubris lookup table
        id: elegant_hubris
        env:
          LOOKUP_TABLE: vendor/PathOfBuilding/src/Data/TimelessJewelData/ElegantHubris.zip
        run: |
          test -s "${LOOKUP_TABLE}"
          unzip -tq "${LOOKUP_TABLE}"
          echo "sha256=$(sha256sum "${LOOKUP_TABLE}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          if git diff --quiet origin/main HEAD -- "${LOOKUP_TABLE}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize Timeless Jewel data
        env:
          TABLE_SHA256: ${{ steps.elegant_hubris.outputs.sha256 }}
          TABLE_CHANGED: ${{ steps.elegant_hubris.outputs.changed }}
        run: |
          {
            echo "## Path of Building vendor sync"
            echo
            echo "- ElegantHubris.zip SHA-256: \`${TABLE_SHA256}\`"
            echo "- ElegantHubris.zip changed: \`${TABLE_CHANGED}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect vendor changes
        id: changes
        run: |
          if git diff --quiet origin/main HEAD -- vendor/PathOfBuilding; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No vendor changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Vendor changes detected"
          fi

      - name: Push changes
        if: ${{ steps.changes.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: git push origin HEAD:main

      - name: Trigger Docker publish
        if: ${{ steps.changes.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        env:
          GH_TOKEN: ${{ secrets.PATH_CHAIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh workflow run docker.yml --repo "${GITHUB_REPOSITORY}" --ref main
