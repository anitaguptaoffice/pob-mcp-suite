name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "packages/pob-mcp/**"
      - "!packages/pob-mcp/**/*.md"
      - "vendor/PathOfBuilding/**"
      - "scripts/collect-metadata.py"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "packages/pob-mcp/**"
      - "!packages/pob-mcp/**/*.md"
      - "vendor/PathOfBuilding/**"
      - "scripts/collect-metadata.py"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pob-mcp-suite

jobs:
  build-test-image:
    runs-on: ubuntu-latest
    concurrency:
      group: docker-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          token: ${{ secrets.PATH_CHAIN_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request'

      - uses: docker/setup-buildx-action@v4

      - name: Collect metadata
        if: github.event_name != 'pull_request'
        id: meta
        run: python3 scripts/collect-metadata.py >> "$GITHUB_OUTPUT"

      - name: Build image for smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: |
            type=gha,scope=pob-mcp-suite
            type=gha,scope=pob-mcp-suite-pr-${{ github.event.pull_request.number }}
          cache-to: ${{ github.event_name == 'pull_request' && format('type=gha,scope=pob-mcp-suite-pr-{0},mode=max', github.event.pull_request.number) || '' }}

      - name: Smoke image
        run: |
          docker run --rm \
            --entrypoint node \
            -e POB_LUA_ENABLED=true \
            -e POE_TRADE_ENABLED=false \
            "${IMAGE_NAME}:ci" \
            /opt/pob-mcp/scripts/mcp-smoke.mjs node /opt/pob-mcp/build/index.js

      - name: Verify engine calculations
        run: |
          docker run --rm --entrypoint node "${IMAGE_NAME}:ci" \
            /opt/pob-mcp/scripts/engine-regression.mjs

      - name: Verify real-engine integration
        run: |
          docker run --rm --entrypoint npm -e POB_REPO_ROOT=/opt/pob-mcp \
            -v "${PWD}/packages/pob-mcp/tests:/opt/pob-mcp/tests:ro" \
            -v "${PWD}/packages/pob-mcp/example-build.xml:/opt/pob-mcp/example-build.xml:ro" \
            "${IMAGE_NAME}:ci" run test:smoke
          docker run --rm --entrypoint npm -e POB_REPO_ROOT=/opt/pob-mcp \
            -v "${PWD}/packages/pob-mcp/tests:/opt/pob-mcp/tests:ro" \
            -v "${PWD}/packages/pob-mcp/example-build.xml:/opt/pob-mcp/example-build.xml:ro" \
            "${IMAGE_NAME}:ci" run test:smoke:offline
          docker run --rm --entrypoint npm -e POB_PATH=/opt/PathOfBuilding/src \
            -v "${PWD}/packages/pob-mcp/tests:/opt/pob-mcp/tests:ro" \
            "${IMAGE_NAME}:ci" run generate:item-oracle:check

      - name: Prepare image tags
        if: github.event_name != 'pull_request'
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${GITHUB_SHA}"
            echo "${IMAGE_NAME}:pob-${{ steps.meta.outputs.short_sha }}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            fi
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PATH_CHAIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=pob-mcp-suite
          cache-to: type=gha,scope=pob-mcp-suite,mode=max

      - name: Update bundled marketplace versions
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:pob-${{ steps.meta.outputs.short_sha }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          POB_MCP_REF: ${{ steps.meta.outputs.suite_sha }}
          POB_TAG: ${{ steps.meta.outputs.pob_tag }}
          POB_SHA: ${{ steps.meta.outputs.pob_sha }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          POB_VERSION: ${{ steps.meta.outputs.pob_version }}
          TREE_VERSION: ${{ steps.meta.outputs.tree_version }}
        run: python3 packages/pob-mcp-market/scripts/update_versions.py

      - name: Validate bundled marketplace
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python3 packages/pob-mcp-market/scripts/validate_market.py
          bash -n packages/pob-mcp-market/pob-docker-mcp/scripts/pob-mcp-docker.sh
          bash -n packages/pob-mcp-market/pob-docker-mcp/scripts/smoke-test.sh

      - name: Commit bundled marketplace version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add packages/pob-mcp-market/versions.json
          if git diff --cached --quiet; then
            echo "Marketplace version is already current"
          else
            git commit -m "chore: update bundled PoB MCP version ${{ steps.meta.outputs.short_sha }}"
            git push origin HEAD:main
          fi
